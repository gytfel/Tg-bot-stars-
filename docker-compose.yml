services:
  bot:
    build: .
    image: shopbot:latest
    container_name: shopbot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/shop.db
    volumes:
      - shopdata:/data
    # нужен только в режиме BOT_MODE=webhook (порт отдаётся nginx/Caddy)
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  shopdata:
